# 【役割】バックエンド（Spring Boot）の設定。
# 【なぜ必要か】サーバーの番号、ログインの Cookie、データベースの扱いなどを、コードを変えずに決めるため。
# 「#」で始まる行はコメント。

# アプリの名前
spring.application.name=campfires-backend
# API を受け付ける入口の番号（画面の開発用サーバーは 5173、バックエンドは 8080）
server.port=8080

# ---------- ログイン（セッション）の Cookie（docs/api/README.md 1.6、非機能要件 3章） ----------
# 30分間操作がなければ、ログアウトになる
server.servlet.session.timeout=30m
# 画面のプログラム（JavaScript）から読めないようにする
server.servlet.session.cookie.http-only=true
# 暗号化された通信（HTTPS）のときだけ送る。localhost は、ブラウザが安全な場所として扱うので、開発中も動く
server.servlet.session.cookie.secure=true
# 別のサイトから来たデータを変える操作には、Cookie を送らない（CSRF の対策）
server.servlet.session.cookie.same-site=lax
# セッションの番号を URL に入れない（URL から漏れないようにするため。Cookie だけを使う）
server.servlet.session.tracking-modes=cookie

# ---------- MyBatis（SQL） ----------
# SQL を書いた XML ファイルの置き場所
mybatis.mapper-locations=classpath:mapper/**/*.xml
# データベースの「user_id」のような名前を、Java の「userId」のような名前に自動で対応させる
mybatis.configuration.map-underscore-to-camel-case=true
# record（値をまとめるだけのクラス）に結果を入れるとき、列の名前と、record の項目の名前を合わせて入れる
# （この設定がないと、列の順番で入れるので、SELECT の列の順番を変えただけで値が入れ違ってしまう）
mybatis.configuration.arg-name-based-constructor-auto-mapping=true

# ---------- Docker Compose（開発用のデータベース） ----------
# アプリを止めても、データベースは動かしたままにする（次に起動したとき、すぐ使えるように）
spring.docker.compose.lifecycle-management=start-only

# ---------- エラーの返し方 ----------
# Spring が用意しているエラーの処理は使わない。代わりに、自分たちの GlobalExceptionHandler で、
# Spring 自身のエラーも含めて Problem Details の形（code 付き）で返す（docs/api/README.md 1.5）
spring.mvc.problemdetails.enabled=false

# ---------- 使わない自動設定（Issue #47） ----------
# spring.autoconfigure.exclude に書いた自動設定は、Spring Boot が使わない（2つ以上は「,」で区切る）。
# - UserDetailsServiceAutoConfiguration：Spring Boot が、仮の利用者と、自動で作ったパスワードを用意し、ログに書き出す仕組み。
#   このアプリは自分たちの仕組み（AuthService）でログインするので、使わない（ログにパスワードを出さないため）
# - JdbcSessionAutoConfiguration：ログインの状態（セッション）を、データベースに置く仕組み（Spring Session JDBC）。
#   ふだん（開発、自動テスト）は、アプリの中（メモリ）にセッションを置くので止めておく。本番だけ使う（application-prod.properties）
spring.autoconfigure.exclude=\
  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
# セッションのテーブルは、Flyway（V3__spring_session.sql）で作るので、自動では作らない
spring.session.jdbc.initialize-schema=never

# ---------- セキュリティ（Issue #47） ----------
# 1回の通信で送れるデータの大きさの上限（バイト）。いちばん大きい入力（イベントの説明 5000文字）でも、十分に収まる大きさ
campfires.request.max-body-bytes=65536
# ログイン・アカウント登録の回数制限（IP アドレスごと）。ふだんは止めておき、本番だけ使う
# （自動テストでは、同じ IP アドレスから何度も登録するため）
campfires.rate-limit.enabled=false
