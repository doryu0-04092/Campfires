# 【役割】バックエンド（Spring Boot）の設定。
# 【なぜ必要か】サーバーの番号、ログインの Cookie、データベースの扱いなどを、コードを変えずに決めるため。
# 「#」で始まる行はコメント。

# アプリの名前
spring.application.name=campfires-backend
# API を受け付ける入口の番号（画面の開発用サーバーは 5173、バックエンドは 8080）
server.port=8080

# ---------- ログイン（セッション）の Cookie（docs/api/README.md 1.6、非機能要件 3章） ----------
# 30分間操作がなければ、ログアウトになる
server.servlet.session.timeout=30m
# 画面のプログラム（JavaScript）から読めないようにする
server.servlet.session.cookie.http-only=true
# 暗号化された通信（HTTPS）のときだけ送る。localhost は、ブラウザが安全な場所として扱うので、開発中も動く
server.servlet.session.cookie.secure=true
# 別のサイトから来たデータを変える操作には、Cookie を送らない（CSRF の対策）
server.servlet.session.cookie.same-site=lax
# セッションの番号を URL に入れない（URL から漏れないようにするため。Cookie だけを使う）
server.servlet.session.tracking-modes=cookie

# ---------- MyBatis（SQL） ----------
# SQL を書いた XML ファイルの置き場所
mybatis.mapper-locations=classpath:mapper/**/*.xml
# データベースの「user_id」のような名前を、Java の「userId」のような名前に自動で対応させる
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- Docker Compose（開発用のデータベース） ----------
# アプリを止めても、データベースは動かしたままにする（次に起動したとき、すぐ使えるように）
spring.docker.compose.lifecycle-management=start-only

# ---------- エラーの返し方 ----------
# Spring が用意しているエラーの処理は使わない。代わりに、自分たちの GlobalExceptionHandler で、
# Spring 自身のエラーも含めて Problem Details の形（code 付き）で返す（docs/api/README.md 1.5）
spring.mvc.problemdetails.enabled=false
