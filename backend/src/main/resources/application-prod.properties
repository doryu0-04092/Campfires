# 【役割】本番用の設定（prod のプロファイル）。環境変数 SPRING_PROFILES_ACTIVE=prod で起動したときに、
# application.properties に加えて読み込まれる（同じ名前の設定は、こちらが優先される）。
# 【なぜ必要か】本番では、データベースのつなぎ先やパスワードを、ファイルに書かずに環境変数で受け取るため。
# パスワードなどの秘密の値は、このファイルに書かない（AWS では Secrets Manager から環境変数で渡す）。
# ${名前} は環境変数の値、${名前:値} は「環境変数がなければ、この値」という書き方。

# ---------- データベース ----------
# sslmode=verify-full：通信を暗号化し、さらに、つないだ相手が本物のデータベースかを証明書で確かめる
# （途中で通信を横取りされる「なりすまし」を防ぐ）。確かめに使う証明書（AWS の RDS の CA）は、Dockerfile で箱に入れる。
# 手元で、暗号化に対応していない PostgreSQL につなぐときだけ、環境変数 DB_SSL_MODE=disable にする
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:campfires}?sslmode=${DB_SSL_MODE:verify-full}&sslrootcert=${DB_SSL_ROOT_CERT:/app/rds-ca.pem}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 開発用の Docker Compose（compose.yaml）は使わない
spring.docker.compose.enabled=false

# ---------- ロードバランサーの後ろで動くための設定 ----------
# ロードバランサー（ALB）が付ける X-Forwarded-Proto などのヘッダーを読み、
# 利用者が HTTPS でアクセスしてきたこと、利用者の本当の IP アドレスを、正しく扱う
server.forward-headers-strategy=native

# ---------- ログインの状態（セッション） ----------
# データベースに置く仕組み（Spring Session JDBC）を使う。application.properties で止めていた一覧から、
# Spring Session JDBC を外し、仮の利用者の仕組みだけを止める
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Cookie の決まり（名前、HttpOnly、Secure、SameSite）は、SessionCookieConfig.java で設定する

# ---------- セキュリティ ----------
# ログイン・アカウント登録の回数制限を使う
campfires.rate-limit.enabled=true

# ---------- パスワードの再設定（F-25） ----------
# メールを送る仕組みがまだない（要件定義書 4.3）ので、本番では止める。止めている間、再設定の API は 503
# （PASSWORD_RESET_UNAVAILABLE）を返し、画面は「パスワードを忘れた場合」のリンクを出さない。
# メールの送信を始めるときは、PasswordResetNotifier の本物の実装を足してから、true にする
campfires.password-reset.enabled=false
# 再設定のリンクの頭に使う、画面の入り口の URL。環境変数 APP_BASE_URL で受け取る
# （なければ、手元で動かす本番用の箱の URL。E2E の既定と同じ）
campfires.app-base-url=${APP_BASE_URL:http://localhost:8081}

# ---------- ログ（docs/observability.md） ----------
# ログを1行ずつの JSON で出す（ECS という決まった形。Spring Boot に最初から入っている機能）。
# CloudWatch Logs で、項目（status、userId、trace_id など）に条件を付けて探せるようにするため
logging.structured.format.console=ecs
# JSON の中の「どのサービスのログか」の名前
logging.structured.ecs.service.name=campfires

# ---------- データベースが応答しなくなったとき（DatabaseOutageTest で見つかった課題） ----------
# 通信の途中でデータベースが止まると、時間の上限がないため、リクエストがずっと待ち続けるおそれがある。
# PostgreSQL の部品（JDBC ドライバー）の設定で、上限を決める（単位は秒）。
# socketTimeout：返事を待つ上限（いちばん重い処理でも数秒で終わるので、30秒あれば十分）。connectTimeout：つなぐときの上限
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.connectTimeout=10
# データベースへの接続を待つ上限（ミリ秒）。既定は 30秒で、データベースが止まると、利用者が 30秒待たされてから
# エラーになっていた（手元でデータベースを止めて確かめた）。5秒で、エラー（500、死活の確認は 503）を返す
spring.datasource.hikari.connection-timeout=5000
